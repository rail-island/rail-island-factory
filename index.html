<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Rail Island Factory - buildings and vehicles for Rail Island</title>
    <meta name="description" content="Browse in 3D the buildings, trains, trams, buses, ships and aircraft of the game Rail Island, all generated from code - and make your own." />
    <meta name="theme-color" content="#101e29" />
    <link rel="canonical" href="https://factory.railisland.com/" />
    <!-- The link preview on Facebook, Reddit, X, Slack and the like. The image is
         src/social-preview.png, emitted under this fixed name by vite.config.ts;
         crawlers need an absolute URL. docs/site/catalog-site.md, "Link previews". -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rail Island Factory" />
    <meta property="og:url" content="https://factory.railisland.com/" />
    <meta property="og:title" content="Rail Island Factory" />
    <meta property="og:description" content="Browse in 3D the buildings, trains, trams, buses, ships and aircraft of the game Rail Island, all generated from code - and make your own." />
    <meta property="og:image" content="https://factory.railisland.com/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rail Island Factory: the Eiffel Tower, Notre-Dame, an alpine hut, a twisted skyscraper and a Boeing 747 above a steam locomotive, a Czech electric locomotive, a Tatra tram and a city bus" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rail Island Factory" />
    <meta name="twitter:description" content="Browse in 3D the buildings, trains, trams, buses, ships and aircraft of the game Rail Island, all generated from code - and make your own." />
    <meta name="twitter:image" content="https://factory.railisland.com/social-preview.png" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
    <link rel="apple-touch-icon" href="/src/apple-touch-icon.png" />
    <!-- Enough style to show the loading line and the error box (src/boot.ts)
         before factory.css arrives, or if it never does. -->
    <style>
      html, body { margin: 0; background: #101e29; color: #eff6f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .factory-boot { margin: 0; padding: 24px 16px; color: #a7bac3; }
      #factory-boot-errors { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 1000; max-height: 45vh; overflow: auto; padding: 10px 12px; border: 1px solid #bf5b58; border-radius: 8px; background: #2a1517; color: #f3d6d5; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
      #factory-boot-errors ul { margin: 6px 0 0; padding-left: 18px; }
      #factory-boot-errors li { overflow-wrap: anywhere; }
      .factory-boot-errors__head { display: flex; gap: 8px; align-items: center; }
      .factory-boot-errors__head b { flex: 1; }
      .factory-boot-errors__head button { min-height: 32px; padding: 4px 10px; border: 1px solid #bf5b58; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
    </style>
  </head>
  <body>
    <div id="root"><p class="factory-boot" id="factory-boot">Loading Rail Island Factory...</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
