# Typecheck + Vitest, run by hand only (Run workflow, on any branch).
#
# Pushes to `master` no longer run it: run the tests locally before landing a
# change (`pnpm typecheck`, `pnpm test`). It never gated deploy.yml.

name: Tests

on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here: the action reads `packageManager` from package.json,
      # and refuses to run when both name a version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Runs even when the typecheck failed, so one run reports both problems.
      - name: Test
        if: '!cancelled()'
        run: pnpm test
