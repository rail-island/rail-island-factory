# Typecheck + Vitest, run by hand only (Run workflow, on any branch).
#
# Pushes to `master` no longer run it: run the tests locally before landing a
# change (`pnpm typecheck`, `pnpm test`). It never gated deploy.yml. The `suite`
# input picks the quick suite (the default) or every suite (`pnpm test:full`).

name: Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "quick (pnpm test, under two minutes) or full (pnpm test:full, every suite)"
        type: choice
        options: [quick, full]
        default: quick

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here: the action reads `packageManager` from package.json,
      # and refuses to run when both name a version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Runs even when the typecheck failed, so one run reports both problems.
      - name: Test
        if: '!cancelled()'
        run: ${{ inputs.suite == 'full' && 'pnpm test:full' || 'pnpm test' }}
